<style>

main.in{animation:in .45s cubic-bezier(.2,.8,.2,1)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}@media(max-width:700px){.two{grid-template-columns:1fr}}.two canvas{height:300px}

h1{font:800 19px Manrope,sans-serif;margin:0;letter-spacing:1.5px;white-space:nowrap}h1 span{background:linear-gradient(90deg,#f6d27a,#c8921f);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav button{background:none;border:0;color:var(--m);padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}

main{max-width:1100px;margin:0 auto;padding:14px}.num{font-variant-numeric:tabular-nums}
.up{color:var(--g)}.dn{color:var(--r)}.m{color:var(--m)}

.box{background:linear-gradient(160deg,#1a1e24,#111418);border:1px solid var(--b);border-radius:14px;padding:14px;box-shadow:0 10px 30px #0006,inset 0 1px #ffffff0d}.box h3{margin:0 0 8px;font-size:14px;color:var(--m);font-weight:500}
.big{font-size:22px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--m);font-weight:500;font-size:13px}

.btn{border:0;border-radius:10px;padding:11px 20px;font:700 14px Manrope,system-ui,sans-serif;cursor:pointer;color:#fff;letter-spacing:.2px;transition:transform .15s,box-shadow .25s,filter .2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn:active{transform:scale(.96)}.buy{background:linear-gradient(180deg,#34d97b,#13a350);box-shadow:0 6px 18px #22c55e45,inset 0 1px #fff5}.sell{background:linear-gradient(180deg,#f46a6a,#c92a2a);box-shadow:0 6px 18px #ef444445,inset 0 1px #fff4}.ghost{background:linear-gradient(180deg,#2a2e35,#1d2025);border:1px solid var(--b);box-shadow:inset 0 1px #ffffff14}.tf .btn.on{background:linear-gradient(180deg,#f6c453,#c8921f);color:#1a1405;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
canvas{width:100%;height:340px;display:block;background:var(--s);border:1px solid var(--b);border-radius:8px}
input,select{background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:9px;font:inherit}
.tf button{padding:6px 9px;font-size:13px}.tf .on{background:var(--a);color:#111}
dialog{position:fixed;top:50%;left:50%;margin:0;transform:translate(-50%,-50%);background:linear-gradient(160deg,#1c2026,#12151a);color:var(--t);border:1px solid var(--b);border-radius:16px;width:min(380px,90%);box-shadow:0 0 0 100vmax #000a,0 30px 80px #000;z-index:20}dialog[open]{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.bar{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.tag{font-size:12px;color:var(--a);border:1px solid var(--a);border-radius:4px;padding:1px 6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--a);padding:11px 18px;border-radius:12px;z-index:30;animation:sl .3s ease;box-shadow:0 10px 30px #000a}
h2{font-size:18px;margin:18px 0 8px}

.admin-hero{background:radial-gradient(700px 220px at 90% 0,#49371966,transparent 65%),linear-gradient(145deg,#20252c,#111418);border:1px solid #5a4826;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 18px 42px #0007}

.admin-tabs .btn{white-space:nowrap}
.admin-stat{min-height:105px}.admin-stat .big{font-size:23px}
.admin-search{width:100%;max-width:360px}

.wallet-actions .row{margin-bottom:0}.wallet-actions select{min-width:180px;flex:1}

@media(max-width:600px){.admin-hero{padding:15px}.wallet-actions .row>*{width:100%}.cash-amount{font-size:32px}}

</style></head><body>
<div id="app"><div id="tk"></div><header><h1>BOLSA<span>PLAY</span></h1><nav id="nav"></nav><span id="bal" class="num" style="font-weight:700;white-space:nowrap"></span><button class="btn ghost" id="mb" style="padding:8px 14px">Mais ▾</button><div id="mn" hidden></div></header>
<main id="v"></main>
<dialog id="dlg"></dialog><div id="au" hidden></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a);
const A=[["PETR4","Petrobras PN","Ações",38.4],["VALE3","Vale ON","Ações",62.1],["ITUB4","Itaú Unibanco PN","Ações",33.7],["BBAS3","Banco do Brasil ON","Ações",27.9],["MGLU3","Magazine Luiza ON","Ações",9.8],["AAPL","Apple Inc.","Ações",228],["TSLA","Tesla Inc.","Ações",245],["NVDA","NVIDIA Corp.","Ações",135],["AMZN","Amazon.com","Ações",195],["MSFT","Microsoft Corp.","Ações",420],["BTC","Bitcoin","Cripto",350000],["ETH","Ethereum","Cripto",17500],["XAU","Ouro (oz)","Commodities",13800],["USD","Dólar","Câmbio",5.6]].map(([s,n,c,p])=>({s,n,c,p0:p,h:[],vol:0}));
const VOL={Ações:.006,Cripto:.012,Commodities:.003,Câmbio:.002};
A.forEach(a=>{let p=a.p0;for(let i=0;i<3000;i++){const o=p;p*=1+R(-1,1)*VOL[a.c];a.h.push({o,c:p,h:Math.max(o,p)*(1+R(0,.002)),l:Math.min(o,p)*(1-R(0,.002)),v:R(1e3,9e3)|0})}a.p=p;a.day=p/(1+R(-.02,.02))});
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),pc=n=>(n>=0?"+":"")+n.toFixed(2).replace(".",",")+"%";
const fmt=p=>p<8?p.toFixed(4).replace(".",","):p<100?p.toFixed(2).replace(".",","):p.toLocaleString("pt-BR",{maximumFractionDigits:2});
let U=null,S={name:"",cash:0,pos:{},tx:[],xp:0,done:{},eq:[]};

let UID=null,sv_=0,warned=0;const save=()=>{if(!U)return;clearTimeout(sv_);sv_=setTimeout(push,700)};
async function push(){if(!U||!UID||!sb)return;clearTimeout(sv_);const h=hst();try{const a=await sb.from("game_state").update({state:S,updated_at:new Date().toISOString()}).eq("user_id",UID),b=await sb.from("players").update({equity:+eq().toFixed(2),hl_wins:h.w,hl_total:h.n}).eq("id",UID);if(a.error||b.error){if(!warned){warned=1;toast("Falha ao salvar. Verifique sua conexão.")}}else warned=0}catch(e){}}
const by=s=>A.find(a=>a.s===s);
const inv=()=>Object.entries(S.pos).reduce((t,[s,p])=>t+p.q*by(s).p,0),eq=()=>S.cash+inv()+(S.hl?.act?.amt||0),cost=()=>Object.values(S.pos).reduce((t,p)=>t+p.q*p.avg,0);
const MS=[["Primeira compra","Faça sua primeira compra",50,()=>S.tx.some(t=>t.t=="C"),1],["Diversificação","Tenha 5 ativos diferentes",150,()=>Object.keys(S.pos).length>=5,5],["Dez negociações","Realize 10 operações",100,()=>S.tx.length>=10,10],["Rentabilidade 5%","Alcance +5% de rentabilidade",200,()=>S.base>0&&eq()>=S.base*1.05,0],["Dobrar o saldo","Chegue ao dobro do bônus inicial",400,()=>S.base>0&&eq()>=S.base*2,0]];
const lvl=()=>1+Math.floor(S.xp/250);
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;$("#app").append(e);setTimeout(()=>e.remove(),2600)}
function chk(){let c=0;MS.forEach(([n,,x,f])=>{if(!S.done[n]&&f()){c=1;S.done[n]=1;S.xp+=x;toast("Missão concluída: "+n+" (+"+x+" XP)")}});if(c)save()}
let tab="inicio",cur="PETR4",tf=5,type="c",N=60;
const TF=[["1m",1],["5m",2],["15m",4],["1h",8],["4h",16],["1d",32],["1sem",64],["1mês",100],["1ano",150]];
const T=[["inicio","Início"],["bolsa","Bolsa"],["acoes","Ações"],["cripto","Cripto"],["carteira","Carteira"],["cash","CASH"],["hl","Higher or Lower"],["rank","Ranking"],["noticias","Notícias"],["missoes","Missões"],["perfil","Perfil"]];
const MAIN=["inicio","bolsa","carteira","hl","rank"];
let isAdmin=false,ANN=[],shownAnn=new Set(),admSub="overview",ADM={users:[],ann:[],logs:[]},walletAsset="PETR4";
function renderMenu(){$("#nav").innerHTML=T.filter(t=>MAIN.includes(t[0])).map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("");$("#mn").innerHTML=T.filter(t=>!MAIN.includes(t[0])).map(([k,l])=>`<button data-k="${k}">${l}</button>`).join("")+(isAdmin?`<button data-k="admin">Painel administrativo</button>`:"")+`<button id="fs">Tela cheia</button><button id="lg">Sair da conta</button><small>Mercado 100% fictício</small>`;$("#lg").onclick=logout;$("#fs").onclick=()=>{document.documentElement.requestFullscreen?.().then(()=>screen.orientation?.lock?.("landscape")).catch(()=>{})}}
renderMenu();
document.querySelector("header").onclick=e=>{const k=e.target.dataset.k;if(e.target.id=="mb"){$("#mn").hidden=!$("#mn").hidden;return}$("#mn").hidden=true;if(k){tab=k;go();if(k=="rank"||k=="hl")loadRk();if(k=="admin")loadAdmin();if(k=="inicio")maybeShowAnn()}};$("#v").addEventListener("click",()=>{$("#mn").hidden=true});
const chg=a=>(a.p/a.day-1)*100;
const list=arr=>`<div class="sc"><table><tr><th>Ativo</th><th>Preço</th><th>Var.</th></tr>${arr.map(a=>`<tr class="l" data-s="${a.s}"><td><b>${a.s}</b> <span class="m">${a.n}</span></td><td class="num">${fmt(a.p)}</td><td class="num ${chg(a)>=0?"up":"dn"}">${pc(chg(a))}</td></tr>`).join("")}</table></div>`;
let RK=[];function ranking(){const r=RK.filter(x=>x.id!=UID).map(x=>({n:x.username,e:+x.equity,b:+x.base}));r.push({n:U+" (você)",e:eq(),b:S.base,me:1});return r.sort((a,b)=>b.e-a.e).slice(0,50)}
async function loadRk(){if(!sb)return;try{const{data}=await sb.from("players").select("id,username,equity,base,hl_wins,hl_total").order("equity",{ascending:false}).limit(50);if(data){RK=data;if(tab=="rank")go()}}catch(e){}}
function go(){document.querySelectorAll("header [data-k]").forEach(b=>b.classList.toggle("on",b.dataset.k==tab));$("#mb").classList.toggle("on",!MAIN.includes(tab));
const v=$("#v");const e=eq(),pl=e-S.base;v.classList.remove("in");void v.offsetWidth;v.classList.add("in");bal();
if(tab=="inicio"){const s=[...A].sort((a,b)=>chg(b)-chg(a));
v.innerHTML=`<div class="grid"><div class="box"><h3>Patrimônio</h3><div class="big num">${brl(e)}</div></div><div class="box"><h3>Saldo</h3><div class="big num">${brl(S.cash)}</div></div><div class="box"><h3>Lucro/prejuízo</h3><div class="big num ${pl>=0?"up":"dn"}">${brl(pl)}</div></div><div class="box"><h3>Nível ${lvl()}</h3><div class="big">${S.xp} XP</div></div></div>
${dt("Maiores altas",list(s.slice(0,3)),1)}${dt("Maiores baixas",list(s.slice(-3).reverse()))}${dt("Últimas operações",txs(5))}`}
else if(tab=="bolsa"||tab=="acoes"||tab=="cripto"){const f=tab=="bolsa"?A:A.filter(a=>tab=="cripto"?a.c=="Cripto":a.c=="Ações");if(!f.some(x=>x.s==cur))cur=f[0].s;const a=by(cur);
v.innerHTML=`<div class="col"><h2 style="margin-top:0">${a.s} — ${a.n} <span class="tag">preço fictício</span></h2>
<div class="row"><span class="big num" id="px">${fmt(a.p)}</span><span class="num ${chg(a)>=0?"up":"dn"}">${pc(chg(a))} (${brl(a.p-a.day)})</span></div><div class="row buyrow"><button class="btn buy" data-o="C">Comprar</button><button class="btn sell" data-o="V">Vender</button><span class="m">Você tem: ${S.pos[a.s]?.q||0}</span></div>
${dt("Ferramentas do gráfico",`<div class="row tf">${TF.map((t,i)=>`<button class="btn ghost ${i==tf?"on":""}" data-tf="${i}">${t[0]}</button>`).join("")}<button class="btn ghost" data-ty>${type=="c"?"Linha":"Candles"}</button><button class="btn ghost" data-z="1">+</button><button class="btn ghost" data-z="-1">−</button></div>`)}
<canvas id="cv"></canvas>${dt("Informações do ativo",`<div class="m">Categoria: ${a.c}<br>Máxima recente: ${fmt(Math.max(...a.h.slice(-30).map(c=>c.h)))}<br>Mínima recente: ${fmt(Math.min(...a.h.slice(-30).map(c=>c.l)))}<br>Volume recente: ${a.h.slice(-30).reduce((t,c)=>t+c.v,0).toLocaleString("pt-BR")}<br>Preços fictícios, sem relação com o mercado real.</div>`)}${dt("Todos os ativos",list(f))}</div>`;draw()}
else if(tab=="carteira"){const ps=Object.entries(S.pos);if(!A.some(a=>a.s==walletAsset))walletAsset=ps[0]?.[0]||"PETR4";const wa=by(walletAsset);
v.innerHTML=`<div class="grid"><div class="box"><h3>Saldo disponível</h3><div class="big num">${brl(S.cash)}</div></div><div class="box"><h3>Total investido</h3><div class="big num">${brl(cost())}</div></div><div class="box"><h3>Patrimônio</h3><div class="big num">${brl(e)}</div></div><div class="box"><h3>Rentabilidade</h3><div class="big num ${pl>=0?"up":"dn"}">${pc(pl/(S.base||1)*100)}</div></div></div>
<h2>Meus ativos</h2>${ps.length?`<div class="sc"><table><tr><th>Ativo</th><th>Qtd</th><th>Médio</th><th>Atual</th><th>Resultado</th></tr>${ps.map(([s,p])=>{const r=(by(s).p-p.avg)*p.q;return`<tr class="l" data-s="${s}"><td>${s}</td><td class="num">${p.q}</td><td class="num">${fmt(p.avg)}</td><td class="num">${fmt(by(s).p)}</td><td class="num ${r>=0?"up":"dn"}">${brl(r)}</td></tr>`}).join("")}</table></div>`:`<p class="m">Nenhum ativo ainda. Escolha um ativo abaixo para começar sua carteira.</p>`}
${dt("Evolução do patrimônio",`<canvas id="cv" style="height:200px"></canvas>`,1)}${dt("Histórico de operações",txs(30))}

const[p,g]=await Promise.all([sb.from("players").select("username,base,suspended").eq("id",user.id).single(),sb.from("game_state").select("state").eq("user_id",user.id).single()]);
if(p.error||g.error){await sb.auth.signOut();return"Não foi possível carregar sua conta. Tente de novo."}
if(p.data.suspended){await sb.auth.signOut();return"Sua conta foi suspensa. Entre em contato com o suporte."}
const st=g.data.state,first=!(st&&st.cash!==undefined);UID=user.id;U=p.data.username;isAdmin=user.email===ADMIN_EMAIL;S=first?newState(+p.data.base):st;S.hl=S.hl||{h:[],act:null,last:null};S.name=U;S.base=S.base||+p.data.base;
if(first)await push();enter(first);return true}
async function logout(){await push();if(sb)await sb.auth.signOut();clearUser();showAuth("in")}
function welcome(){const d=$("#dlg");d.innerHTML=`<h3 style="margin-top:0">Bem-vindo, ${U}!</h3><p>Seu bônus de boas-vindas:</p><div class="big num up" style="font-size:34px">${brl(S.base)}</div><p class="m">Dinheiro fictício. Invista e faça crescer, mas lembre: dá para ganhar e dá para perder.</p><button class="btn buy" id="wk" style="width:100%">Começar</button>`;d.show();$("#wk").onclick=()=>d.close()}
function showAuth(m="in",msg="",ok){const e=$("#au");e.hidden=false;
const head=m=="in"||m=="up"?`<div class="row tf" style="justify-content:center"><button class="btn ghost ${m=="in"?"on":""}" data-au="in">Entrar</button><button class="btn ghost ${m=="up"?"on":""}" data-au="up">Criar conta</button></div>`:`<p class="m" style="text-align:center">${m=="fg"?"Informe seu e-mail para receber o link de recuperação.":"Defina sua nova senha."}</p>`;
e.innerHTML=`<div class="box ac"><h1 style="text-align:center;font-size:24px">BOLSA<span>PLAY</span></h1>${head}
${m=="up"?`<div class="row"><input id="un" placeholder="Usuário (3 a 16: letras, números, _ ou .)" autocomplete="username" autocapitalize="none"></div>`:""}
${m!="rec"?`<div class="row"><input id="em" type="email" placeholder="E-mail" autocomplete="email" autocapitalize="none"></div>`:""}
${m!="fg"?`<div class="row"><input id="pw" type="password" placeholder="${m=="rec"?"Nova senha":"Senha"}" autocomplete="${m=="in"?"current-password":"new-password"}"></div>`:""}
${m=="up"||m=="rec"?`<div class="row"><input id="pw2" type="password" placeholder="Repita a senha" autocomplete="new-password"></div>`:""}
${m!="fg"?`<label class="m" style="font-size:12px;display:block"><input type="checkbox" id="sp" style="width:auto"> Mostrar senha</label>`:""}
<p id="ae" class="${ok?"up":"dn"}" style="margin:4px 0;min-height:18px"></p>
<button class="btn buy" id="ago" style="width:100%">${{in:"Entrar",up:"Criar conta e ganhar bônus",fg:"Enviar link",rec:"Salvar nova senha"}[m]}</button>
${m=="in"?`<p style="text-align:center;margin:10px 0 0"><a data-au="fg">Esqueci a senha</a></p>`:""}${m=="fg"?`<p style="text-align:center;margin:10px 0 0"><a data-au="in">Voltar</a></p>`:""}
<p class="m" style="font-size:12px;margin-bottom:0">${m=="up"?"Ganhe até R$ 100 fictícios de boas-vindas. ":""}Dinheiro 100% fictício.</p></div>`;
$("#ae").textContent=msg;e.querySelectorAll("[data-au]").forEach(b=>b.onclick=ev=>{ev.preventDefault();showAuth(b.dataset.au)});
const sp=$("#sp");if(sp)sp.onchange=ev=>{document.querySelectorAll("#pw,#pw2").forEach(x=>x.type=ev.target.checked?"text":"password")};
const f=async()=>{const bt=$("#ago");bt.disabled=true;try{await({in:doLogin,up:doReg,fg:doForgot,rec:doRec}[m])()}catch(x){$("#ae").textContent="Falha de conexão. Tente de novo."}bt.disabled=false};
$("#ago").onclick=f;e.onkeydown=ev=>{if(ev.key=="Enter")f()}}
const mail=x=>/^\S+@\S+\.\S+$/.test(x),err=t=>{$("#ae").textContent=t};
async function doReg(){const u=$("#un").value.trim().toLowerCase(),em=$("#em").value.trim(),p=$("#pw").value;if(!sb)return err("Sem conexão com o servidor.");
if(!/^[a-z0-9_.]{3,16}$/.test(u))return err("Usuário: 3 a 16 letras, números, _ ou .");if(!mail(em))return err("Informe um e-mail válido");if(p.length<6)return err("A senha precisa ter 6 caracteres ou mais");if(p!==$("#pw2").value)return err("As senhas não conferem");
const f=await sb.rpc("username_free",{u});if(f.error)return err(tr(f.error.message));if(!f.data)return err("Esse usuário já existe");
const{data,error}=await sb.auth.signUp({email:em,password:p,options:{data:{username:u},emailRedirectTo:location.origin}});if(error)return err(tr(error.message));
if(!data.session)return showAuth("in","Conta criada! Confirme seu e-mail para entrar.",1);const r=await loadSession();if(r!==true)err(r)}
async function doLogin(){const em=$("#em").value.trim(),p=$("#pw").value;if(!sb)return err("Sem conexão com o servidor.");if(Date.now()<lock)return err("Muitas tentativas. Aguarde 30 segundos.");
const{error}=await sb.auth.signInWithPassword({email:em,password:p});if(error){if(++fails>=5){lock=Date.now()+30000;fails=0}return err(tr(error.message))}fails=0;const r=await loadSession();if(r!==true)err(r)}
async function doForgot(){const em=$("#em").value.trim();if(!mail(em))return err("Informe um e-mail válido");const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});if(error)return err(tr(error.message));showAuth("in","Se o e-mail existir, enviamos o link de recuperação.",1)}
async function doRec(){const p=$("#pw").value;if(p.length<6)return err("A senha precisa ter 6 caracteres ou mais");if(p!==$("#pw2").value)return err("As senhas não conferem");const{error}=await sb.auth.updateUser({password:p});if(error)return err(tr(error.message));REC=false;history.replaceState(null,"",location.pathname);const r=await loadSession();if(r!==true)showAuth("in",r)}
async function loadAdmin(){if(!isAdmin||!sb)return;const[u,a,l]=await Promise.all([sb.rpc("admin_list_players"),sb.from("announcements").select("*").order("id",{ascending:false}),sb.rpc("admin_list_logs")]);ADM.users=u.data||[];ADM.ann=a.data||[];ADM.logs=l.data||[];if(u.error||a.error||l.error)toast("Algumas informações administrativas não puderam ser carregadas");if(tab=="admin")go()}
function admin(){if(!isAdmin){tab="inicio";return go()}
const active=ADM.users.filter(p=>!p.suspended).length,suspended=ADM.users.length-active,total=ADM.users.reduce((t,p)=>t+(+p.equity||0),0),published=ADM.ann.filter(a=>a.active).length;
const tabs=[["overview","Visão geral"],["users","Jogadores"],["ann","Avisos e anúncios"],["logs","Auditoria"]];
const overview=`<div class="grid"><div class="box admin-stat"><h3>Jogadores cadastrados</h3><div class="big">${ADM.users.length}</div><span class="m">Contas registradas</span></div><div class="box admin-stat"><h3>Jogadores ativos</h3><div class="big up">${active}</div><span class="m">Com acesso liberado</span></div><div class="box admin-stat"><h3>Suspensos</h3><div class="big dn">${suspended}</div><span class="m">Contas bloqueadas</span></div><div class="box admin-stat"><h3>Anúncios ativos</h3><div class="big">${published}</div><span class="m">Avisos publicados</span></div><div class="box admin-stat"><h3>Patrimônio somado</h3><div class="big num">${brl(total)}</div><span class="m">Valores fictícios dos jogadores</span></div></div><div class="box" style="margin-top:12px"><b>Atividade administrativa</b><p class="m" style="margin-bottom:0">${ADM.logs.length} registros de auditoria disponíveis. Use as abas para gerenciar contas, publicações e consultar alterações.</p></div>`;
const usersHtml=`<div class="row" style="justify-content:space-between"><input id="adm_search" class="admin-search" placeholder="Buscar por usuário ou ID..."><span class="m">${ADM.users.length} contas</span></div><div class="sc"><table><thead><tr><th>Usuário</th><th>Patrimônio</th><th>Status</th><th>Ações</th></tr></thead><tbody id="adm_user_rows">${ADM.users.map(p=>`<tr data-user-search="${String(p.username||"").toLowerCase()} ${p.id}"><td><b>@${esc(p.username||"sem-nome")}</b><div class="m" style="font-size:10px">${p.id}</div></td><td class="num">${brl(+p.equity||0)}</td><td>${p.suspended?'<span class="tag" style="color:var(--r);border-color:var(--r)">Suspenso</span>':'<span class="tag" style="color:var(--g);border-color:var(--g)">Ativo</span>'}</td><td><div class="row" style="margin:0;flex-wrap:nowrap"><button class="btn ghost" style="padding:7px 9px" data-adm="bal:${p.id}">Saldo</button><button class="btn ${p.suspended?"buy":"sell"}" style="padding:7px 9px" data-adm="susp:${p.id}:${!p.suspended}">${p.suspended?"Reativar":"Suspender"}</button></div></td></tr>`).join("")}</tbody></table></div>`;
const annHtml=`<button class="btn buy" style="margin-bottom:12px" data-adm="new">＋ Criar aviso ou anúncio</button>${ADM.ann.length?ADM.ann.map(a=>`<div class="box" style="margin-bottom:9px"><div class="row" style="justify-content:space-between;margin-top:0"><b>${a.kind=="aviso"?"Aviso":"Anúncio"}</b>${a.active?'<span class="tag" style="color:var(--g);border-color:var(--g)">Ativo</span>':'<span class="tag">Pausado</span>'}</div><div>${esc(a.title||"(sem título)")}</div><div class="m" style="font-size:13px">${esc((a.body||"").slice(0,100))}</div><div class="row" style="margin-bottom:0"><button class="btn ghost" style="padding:7px 10px" data-adm="edit:${a.id}">Editar</button><button class="btn ghost" style="padding:7px 10px" data-adm="toggle:${a.id}:${!a.active}">${a.active?"Pausar":"Ativar"}</button><button class="btn sell" style="padding:7px 10px" data-adm="del:${a.id}">Excluir</button></div></div>`).join(""):`<p class="m">Nenhum aviso ou anúncio cadastrado.</p>`}`;
const logsHtml=ADM.logs.length?`<div class="sc"><table><tr><th>Data</th><th>Ação</th><th>Jogador</th><th>Motivo</th></tr>${ADM.logs.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("pt-BR")}</td><td>${esc(x.action)}</td><td>${esc(x.target_user||"—")}</td><td>${esc(x.reason||"—")}</td></tr>`).join("")}</table></div>`:`<p class="m">Nenhuma ação administrativa registrada ainda.</p>`;
$("#v").innerHTML=`<div class="admin-hero"><div class="eyebrow">Área restrita · BOLSA PLAY</div><h2 style="font-size:25px;margin:7px 0">Central administrativa</h2><p class="m" style="margin:0">Gerencie usuários, publicações e acompanhe as ações feitas no painel.</p></div><div class="admin-tabs">${tabs.map(([k,l])=>`<button class="btn ghost ${admSub==k?"on":""}" data-admsub="${k}">${l}</button>`).join("")}<button class="btn ghost" data-adm="refresh">↻ Atualizar</button></div>${admSub=="overview"?overview:admSub=="users"?usersHtml:admSub=="ann"?annHtml:logsHtml}`;
const search=$("#adm_search");if(search)search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll("[data-user-search]").forEach(r=>r.hidden=!r.dataset.userSearch.includes(q))}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function startCashAd(){const b=$("#cash_watch");if(!b||b.disabled)return;b.disabled=true;b.textContent="Preparando anúncio...";const{data:session,error}=await sb.rpc("cash_ad_start");if(error||!session){b.disabled=false;b.textContent="▶ Assistir anúncio e ganhar R$100";return toast("Não foi possível iniciar. Tente novamente.")}
const d=$("#dlg");d.innerHTML=`<div style="text-align:center;padding:8px 0"><div style="font-size:34px">▶</div><div class="tag">ANÚNCIO DEMONSTRATIVO</div><h3 style="font-size:21px">Sua recompensa está quase lá</h3><p class="m">Aguarde a demonstração terminar para liberar seu CASH.</p><div class="cash-amount" style="font-size:32px">R$ 100,00</div><div class="bar" style="margin:14px 0"><i id="cash_progress" style="width:0%"></i></div><div class="big num" id="cash_count">12</div><p class="m" style="font-size:11px">Esta simulação não exibe publicidade comercial.</p></div>`;d.show();let left=12,claimed=false;const timer=setInterval(async()=>{left--;const c=$("#cash_count"),pr=$("#cash_progress");if(c)c.textContent=left;if(pr)pr.style.width=((12-left)/12*100)+"%";if(left<=0){clearInterval(timer);const{data,error}=await sb.rpc("cash_ad_claim",{session_id:session});if(error){d.close();b.disabled=false;b.textContent="▶ Assistir anúncio e ganhar R$100";return toast("Não foi possível liberar a recompensa: "+error.message)}S.cash=Number(data);claimed=true;clearTimeout(sv_);save();d.close();toast("Você recebeu R$100 fictícios!");go()}},1000);d.addEventListener("close",()=>{clearInterval(timer);if(!claimed){b.disabled=false;b.textContent="▶ Assistir anúncio e ganhar R$100"}},{once:true});}
async function admSuspend(id,val){const reason=val?(prompt("Motivo da suspensão (opcional):")||null):null;const{error}=await sb.rpc("admin_set_suspended",{target:id,val,reason});if(error)return toast("Erro: "+error.message);toast(val?"Jogador suspenso":"Jogador reativado");loadAdmin()}
function admBalPrompt(id){const v=prompt("Valor a adicionar (use negativo para remover):");if(v===null)return;const n=+v;if(!n)return toast("Valor inválido");const reason=prompt("Motivo (opcional):")||null;admAdjust(id,n,reason)}
async function admAdjust(id,delta,reason){const{error}=await sb.rpc("admin_adjust_cash",{target:id,delta,reason});if(error)return toast("Erro: "+error.message);toast("Saldo ajustado");loadAdmin()}
function admEditAnn(a){const d=$("#dlg"),isNew=!a;a=a||{kind:"aviso",title:"",body:"",image_url:"",link_url:"",button_text:""};let kind=a.kind;
d.innerHTML=`<h3 style="margin-top:0">${isNew?"Novo":"Editar"}</h3>
<div class="row tf">${[["aviso","Aviso"],["anuncio","Anúncio"]].map(([k,l])=>`<button class="btn ghost ${kind==k?"on":""}" data-k2="${k}">${l}</button>`).join("")}</div>
<div class="row"><input id="e_title" placeholder="Título (opcional)" value="${esc(a.title||"")}"></div>
<div class="row"><input id="e_body" placeholder="Texto (opcional)" value="${esc(a.body||"")}"></div>
<div class="row"><input id="e_img" placeholder="URL da imagem (opcional)" value="${esc(a.image_url||"")}"></div>
<div class="row"><input id="e_link" placeholder="Link de destino (opcional)" value="${esc(a.link_url||"")}"></div>
<div class="row"><input id="e_btn" placeholder="Texto do botão (opcional)" value="${esc(a.button_text||"")}"></div>
<p id="e_err" class="dn" style="min-height:18px;margin:4px 0"></p>
<div class="row"><button class="btn buy" id="e_save" style="flex:1">Publicar</button><button class="btn ghost" id="e_cancel">Cancelar</button></div>`;
d.querySelectorAll("[data-k2]").forEach(b=>b.onclick=()=>{kind=b.dataset.k2;d.querySelectorAll("[data-k2]").forEach(x=>x.classList.toggle("on",x.dataset.k2==kind))});
d.show();$("#e_cancel").onclick=()=>d.close();
$("#e_save").onclick=async()=>{const imageUrl=$("#e_img").value.trim(),linkUrl=$("#e_link").value.trim();if(imageUrl&&!/^https:\/\//i.test(imageUrl))return $("#e_err").textContent="A imagem precisa usar uma URL HTTPS.";if(linkUrl&&!/^https:\/\//i.test(linkUrl))return $("#e_err").textContent="O link precisa usar HTTPS.";const row={kind,title:$("#e_title").value.trim()||null,body:$("#e_body").value.trim()||null,image_url:imageUrl||null,link_url:linkUrl||null,button_text:$("#e_btn").value.trim()||null,active:true};
const q=isNew?sb.from("announcements").insert(row):sb.from("announcements").update(row).eq("id",a.id);
const{error}=await q;if(error)return $("#e_err").textContent="Erro: "+error.message;d.close();toast("Publicado");loadAdmin()}}
async function admToggleAnn(id,val){const{error}=await sb.from("announcements").update({active:val}).eq("id",id);if(error)return toast("Erro: "+error.message);loadAdmin()}
async function admDelAnn(id){if(!confirm("Excluir este item?"))return;const{error}=await sb.from("announcements").delete().eq("id",id);if(error)return toast("Erro: "+error.message);loadAdmin()}
$("#v").addEventListener("click",e=>{const s=e.target.closest("[data-admsub]");if(s){admSub=s.dataset.admsub;go();return}
const b=e.target.closest("[data-adm]");if(!b)return;const[k,p1,p2]=b.dataset.adm.split(":");
if(k=="susp")admSuspend(p1,p2=="true");else if(k=="bal")admBalPrompt(p1);else if(k=="new")admEditAnn(null);else if(k=="refresh")loadAdmin();
else if(k=="edit")admEditAnn(ADM.ann.find(x=>x.id==p1));else if(k=="toggle")admToggleAnn(p1,p2=="true");else if(k=="del")admDelAnn(p1)});
async function boot(){$("#lg").onclick=logout;if(!sb)return showAuth("in","Não foi possível conectar ao servidor. Recarregue a página.");
sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY"){REC=true;showAuth("rec")}else if(ev=="SIGNED_OUT"&&U){clearUser();showAuth("in")}});
if(REC)return showAuth("rec");const{data:{session}}=await sb.auth.getSession();if(session&&!REC){const r=await loadSession();if(r!==true)showAuth("in",r)}else if(!REC)showAuth("in")}
setInterval(()=>{if(U){push();loadRk()}},30000);addEventListener("pagehide",()=>{if(U)push()});document.addEventListener("visibilitychange",()=>{if(document.hidden&&U)push()});
addEventListener("resize",()=>{if(tab=="hl")hch();else if(tab=="carteira")line();else if(["bolsa","acoes","cripto"].includes(tab))draw()});tkr();boot();
</script></body></html>
